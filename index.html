<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141617" media="(prefers-color-scheme: dark)">
<meta name="description" content="Cabas — liste de courses simple, hors ligne.">
<title>Cabas</title>
<link rel="manifest" id="manifest" href="manifest.webmanifest">
<script>
  /* Environnement : prod = github.io/cabas/, test = github.io/cabas-test/, sinon local (PC). */
  (function(){
    var h=location.hostname, p=location.pathname;
    var env = /github\.io$/.test(h) ? (/-test\//.test(p) ? 'test' : 'prod') : 'local';
    window.CABAS_ENV = env;
    if (env !== 'prod') {
      document.getElementById('manifest').href = 'manifest-test.webmanifest';
      document.title = 'Cabas ' + env.toUpperCase();
    }
  })();
</script>
<script src="version.js"></script>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header>
    <div class="row">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14l-1.3 9.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg>
        Cabas <span class="tag" id="envTag" hidden></span>
      </div>
      <button class="hbtn" id="sortBtn" aria-label="Changer le tri"></button>
      <button class="hbtn icon" id="setBtn" aria-label="Réglages">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="count" id="count"></div>
    <div class="progress"><i id="prog"></i></div>
    <div class="filament"></div>
  </header>

  <main><div class="grid" id="grid"></div></main>

  <div class="bottom"><div class="in">
    <div class="addgroup">
      <button id="addTxt" aria-label="Ajouter au clavier">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Texte
      </button>
      <button id="addVoc" aria-label="Ajouter à la voix">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>Voix
      </button>
    </div>
    <button class="clear" id="clearBtn" aria-label="Retirer les articles pris">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
      Vider <span class="badge" id="clearN">0</span>
    </button>
  </div></div>
</div>

<div class="toast" id="toast"><div class="in"><span id="toastMsg"></span><button id="toastUndo">Annuler</button><div class="bar" id="toastBar"></div></div></div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script src="js/app.js"></script>
</body>
</html>
